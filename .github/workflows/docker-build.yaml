name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: sha-${{ env.SHORT_SHA }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            context: .
            file: ./docker/common/php-fpm/Dockerfile
            target: production

          - name: nginx
            context: .
            file: ./docker/production/nginx/Dockerfile
            target: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Short SHA
        run: echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log into GitHub Container Registry
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          build-args: |
            COMPOSER_AUTH_JSON=${{ secrets.COMPOSER_AUTH_JSON }}

  update-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout Manifest Repository
        uses: actions/checkout@v4
        with:
          repository: know-book/dev-portal-manifest
          ref: main
          token: ${{ secrets.MANIFEST_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Install Kustomize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update Kubernetes Image Tags in dev-portal-manifest
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          kustomize edit set image ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/app:${{ env.NEW_TAG }}
          kustomize edit set image ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/nginx:${{ env.NEW_TAG }}

      - name: Commit and Push to Manifest Repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add kustomization.yaml
          git commit -m "chore(cd): update tags to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]" || exit 0
          git push origin main
