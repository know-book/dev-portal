name: Build and Push Docker Image

on:
  push:
    branches:
      - {{ default_branch }}
  workflow_dispatch:

env:
  IMAGE_REPOSITORY: {{ image_repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', '{{ default_branch }}') }}
            type=sha,format=short,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

  update-gitops:
    needs: build-and-push
    if: ${{ github.ref == format('refs/heads/{0}', '{{ default_branch }}') && {{ update_gitops }} }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kustomize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update Kubernetes image tag
        run: |
          NEW_TAG="sha-${GITHUB_SHA::7}"
          cd "{{ gitops_path }}"
          kustomize edit set image "${IMAGE_REPOSITORY}:${NEW_TAG}"

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "{{ gitops_path }}/kustomization.yaml"
          git diff --cached --quiet && exit 0
          git commit -m "chore(cd): update image to sha-${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "{{ default_branch }}"
          git push origin "{{ default_branch }}"
