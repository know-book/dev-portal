apiVersion: v1
kind: Service
metadata:
  name: {{ project_slug }}-web
  labels:
    app.kubernetes.io/name: {{ project_slug }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ project_slug }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
