events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Trust Cloudflare IP ranges only
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    set_real_ip_from 140.113.207.241/32;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 10m;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        # Pod 內部自檢用:Nova checkLicense() 打 https://mock.codes/204,
        # hostAlias 把 mock.codes 指到 127.0.0.1,所以走本機的 443。
        listen 443 ssl;
        server_name localhost mock.codes nova.laravel.com;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        root /var/www/public;
        index index.php index.html;

        # Nova checkLicense() 自檢端點:直接由 nginx 回 204,
        # 不進 Laravel(避免 POST 吃到 CSRF middleware 回 419)。
        location = /204 {
            return 204;
        }

        location = /api/license-check {
            return 204;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }
}
